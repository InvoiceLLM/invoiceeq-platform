name: Build Desktop App (Windows, On-Demand)

# Feature 18 (Desktop App) / FE Gap 326 — Task 1's scaffold has never compiled
# locally: the dev machine it was written on has no Rust/MSVC toolchain, and
# once installed, hit Windows Smart App Control blocking freshly-built
# binaries from running at all. This workflow compiles the same scaffold on a
# clean Windows runner instead, so the code can be verified without depending
# on that machine's local toolchain or its security policy.
#
# Deliberately `cargo build` only, not `tauri build` / `cargo tauri build` —
# `apps/invoice-desktop/src-tauri/tauri.conf.json` sets `bundle.active: false`
# on purpose (see that file's own comment and feature_18_desktop_app.md §6.2),
# so packaging/installers/code-signing stay Task 7+8's decision, not
# something this verification workflow does as a side effect. This job proves
# the scaffold compiles and produces a runnable debug .exe; it does not
# produce a distributable installer.
#
# Manual trigger only, matching this repo's e2e-regression.yml convention —
# this repeatedly compiles a large Rust dependency tree and there is no
# reason to run it on every push while Feature 18 is still scaffold-only.
on:
  workflow_dispatch:
    inputs:
      fe_url:
        description: "invoice-fe origin to bake in (compile-time INVOICE_DESKTOP_FE_URL). Leave default to point at localhost:3000, matching local dev — there is no deployed invoice-desktop production origin yet."
        required: false
        default: "http://localhost:3000"

jobs:
  build:
    runs-on: windows-latest
    env:
      WORKDIR: Prod_Invoice_LLM/apps/invoice-desktop
      # Compile-time override — resolve_fe_url()'s 2nd resolution tier
      # (src-tauri/src/lib.rs). Left settable per-run via the input above
      # since the real production invoice-fe origin isn't known yet
      # (.env.example still says REPLACE_WITH_DEPLOYED_FE_ORIGIN).
      INVOICE_DESKTOP_FE_URL: ${{ github.event.inputs.fe_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust (stable-x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.WORKDIR }}/src-tauri/target
          key: ${{ runner.os }}-cargo-invoice-desktop-${{ hashFiles('Prod_Invoice_LLM/apps/invoice-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-invoice-desktop-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm install
        run: npm install
        working-directory: ${{ env.WORKDIR }}

      - name: cargo build (debug — compiles the scaffold, does not bundle/package)
        run: cargo build --manifest-path src-tauri/Cargo.toml
        working-directory: ${{ env.WORKDIR }}

      - name: Locate the compiled debug executable
        id: locate
        shell: bash
        run: |
          exe=$(find "${{ env.WORKDIR }}/src-tauri/target/debug" -maxdepth 1 -iname "*.exe" | head -n1)
          if [ -z "$exe" ]; then
            echo "No .exe produced — build step should already have failed the job before this point." >&2
            exit 1
          fi
          echo "Found: $exe"
          echo "exe_path=$exe" >> "$GITHUB_OUTPUT"

      - name: Upload the debug executable as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoice-desktop-debug-windows
          path: ${{ steps.locate.outputs.exe_path }}
          retention-days: 14
