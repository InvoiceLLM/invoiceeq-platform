name: Deploy to Dev Environment (Azure)

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: invoice-llm-dev
      ACR_NAME: ${{ secrets.ACR_NAME }} # e.g. acrinvoiceaidev

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate with Azure (OIDC or Service Principal Secret)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Log in to Azure Container Registry (ACR)
      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      # 4. Build and Push Backend API Image
      - name: Build & Push Backend API
        run: |
          docker build -f Prod_Invoice_LLM/docker/Dockerfile.be -t $ACR_NAME.azurecr.io/invoice-be:${{ github.sha }} -t $ACR_NAME.azurecr.io/invoice-be:latest Prod_Invoice_LLM
          docker push $ACR_NAME.azurecr.io/invoice-be:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/invoice-be:latest

      # 5. Build and Push Celery Worker Image
      - name: Build & Push Celery Worker
        run: |
          docker build -f Prod_Invoice_LLM/docker/Dockerfile.worker -t $ACR_NAME.azurecr.io/celery-worker:${{ github.sha }} -t $ACR_NAME.azurecr.io/celery-worker:latest Prod_Invoice_LLM
          docker push $ACR_NAME.azurecr.io/celery-worker:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/celery-worker:latest

      # 6. Build and Push Frontend UI Image
      - name: Build & Push Frontend UI
        run: |
          docker build -f Prod_Invoice_LLM/docker/Dockerfile.fe -t $ACR_NAME.azurecr.io/invoice-fe:${{ github.sha }} -t $ACR_NAME.azurecr.io/invoice-fe:latest Prod_Invoice_LLM
          docker push $ACR_NAME.azurecr.io/invoice-fe:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/invoice-fe:latest

      # 7. Deploy Infrastructure (Bicep) with Updated Image Tags
      - name: Deploy to Azure Container Apps
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./Prod_Invoice_LLM/infra/main.bicep
          parameters: >
            ./Prod_Invoice_LLM/infra/params.dev.json
            backendImage=${{ env.ACR_NAME }}.azurecr.io/invoice-be:${{ github.sha }}
            celeryWorkerImage=${{ env.ACR_NAME }}.azurecr.io/celery-worker:${{ github.sha }}
            frontendImage=${{ env.ACR_NAME }}.azurecr.io/invoice-fe:${{ github.sha }}
