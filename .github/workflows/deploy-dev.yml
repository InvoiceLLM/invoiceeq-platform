name: Deploy to Dev Environment (Azure)

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-invoice-llm-dev
  ACR_NAME: acrinvoicellmdev2

jobs:
  # Path-filtered so each service only rebuilds/redeploys when its own
  # files changed, instead of the old single job that rebuilt all 4
  # containers on every push regardless of what changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.decide.outputs.be }}
      worker: ${{ steps.decide.outputs.worker }}
      fe: ${{ steps.decide.outputs.fe }}
      website: ${{ steps.decide.outputs.website }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            be:
              - 'Prod_Invoice_LLM/apps/invoice-be/**'
              - 'Prod_Invoice_LLM/docker/Dockerfile.be'
            worker:
              - 'Prod_Invoice_LLM/apps/invoice-be/**'
              - 'Prod_Invoice_LLM/docker/Dockerfile.worker'
            fe:
              - 'Prod_Invoice_LLM/apps/invoice-fe/**'
              - 'Prod_Invoice_LLM/docker/Dockerfile.fe'
            website:
              - 'Prod_Invoice_LLM/apps/invoice-website/**'
              - 'Prod_Invoice_LLM/docker/Dockerfile.website'

      # dorny/paths-filter has no meaningful "before" commit to diff against
      # on workflow_dispatch (no push event => no base sha), so a manual run
      # deploys everything rather than silently deploying nothing.
      - name: Decide what to deploy
        id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "be=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "fe=true" >> "$GITHUB_OUTPUT"
            echo "website=true" >> "$GITHUB_OUTPUT"
          else
            echo "be=${{ steps.filter.outputs.be }}" >> "$GITHUB_OUTPUT"
            echo "worker=${{ steps.filter.outputs.worker }}" >> "$GITHUB_OUTPUT"
            echo "fe=${{ steps.filter.outputs.fe }}" >> "$GITHUB_OUTPUT"
            echo "website=${{ steps.filter.outputs.website }}" >> "$GITHUB_OUTPUT"
          fi

  # Resolves Azure FQDNs + the (public) Clerk publishable key needed as
  # Docker build-args for the FE/website images (NEXT_PUBLIC_* vars are
  # inlined into the client bundle by `next build`, so they must be known
  # BEFORE those images build -- a runtime Container App env var arrives
  # too late). Only runs when fe and/or website actually changed.
  resolve-fqdns:
    needs: changes
    if: needs.changes.outputs.fe == 'true' || needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    outputs:
      pub_key: ${{ steps.resolve.outputs.pub_key }}
      fe_url: ${{ steps.resolve.outputs.fe_url }}
      website_url: ${{ steps.resolve.outputs.website_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.Azure_Dev_Credentials }}

      - name: Resolve Azure FQDNs and Clerk key
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          params="Prod_Invoice_LLM/infra/params.dev.json"

          fe_fqdn=$(az containerapp show --name ca-invoice-fe-dev \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)

          # Clerk publishable keys are public by design (they already ship inside
          # the browser bundle), so this is read from the committed params file
          # rather than a GitHub secret.
          pub_key=$(python3 -c "import json;print(json.load(open('$params'))['parameters']['nextPublicClerkPublishableKey']['value'])")

          if [ -z "$pub_key" ] || [[ "$pub_key" == *mock* ]] || [[ "$pub_key" == *REPLACE_WITH* ]]; then
            echo "ERROR: nextPublicClerkPublishableKey in $params is empty or still a placeholder." >&2
            exit 1
          fi

          website_fqdn=$(az containerapp show --name ca-invoice-website-dev \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)

          if [ -z "$website_fqdn" ]; then
            echo "WARNING: ca-invoice-website-dev not found yet -- falling back to FE origin for website_url." >&2
            website_fqdn="${fe_fqdn}"
          fi

          echo "website_url=https://${website_fqdn}" >> "$GITHUB_OUTPUT"
          echo "fe_url=https://${fe_fqdn}" >> "$GITHUB_OUTPUT"
          echo "pub_key=${pub_key}" >> "$GITHUB_OUTPUT"

          echo "Resolved FE FQDN: ${fe_fqdn}"
          echo "Resolved website FQDN: ${website_fqdn}"

  # Note: CLERK_SECRET_KEY is NOT synced to Key Vault by this workflow.
  # infra/05-secrets.bicep (Stage 5 of deploy-all.ps1) already seeds it from
  # the local, gitignored infra/params.dev.secrets.json the one time someone
  # runs the full manual deploy -- Key Vault secrets persist independently
  # after that, and this workflow never runs bicep, so there's nothing for
  # CI to re-sync on every push. If the key ever needs to rotate, update
  # params.dev.secrets.json locally and re-run Stage 5.

  # Feature 23 pre-deploy gate (2026-08-23, re-designed 2026-08-24 after the
  # inline version in commit fe021a3 was reverted in b1b9ff3 -- see that
  # revert's message for the failure: the GitHub Actions service principal
  # (Azure_Dev_Credentials, Contributor+AcrPush on the RG only) tried to read
  # AZURE-OPENAI-API-KEY directly from Key Vault and got ForbiddenByRbac, a
  # role that SP was never meant to hold).
  #
  # This version never reads the OpenAI key on the runner at all. It starts
  # an on-demand execution of the SAME caj-benchmark-eval-dev Container App
  # Job that infra/benchmark-eval-job-only.bicep / 08-apps.bicep's
  # benchmarkEvalJob module already declare for the 03:00 UTC nightly run,
  # with its container command/args overridden for this one execution only
  # via `az containerapp job start --command/--args` -- that override is
  # per-execution and does not touch the job's persisted template, so the
  # nightly Schedule-trigger run is untouched and keeps using its own
  # (broader, --no-gate, live-mode) command. The job's managed identity
  # (id-invoicellm-dev) already holds Key Vault Secrets User on
  # kv-invoicellm-dev and Cognitive Services User on the OpenAI account
  # (confirmed live via `az role assignment list`, 2026-08-24) -- the Key
  # Vault read happens inside Azure under that identity, never on this
  # runner, and Azure_Dev_Credentials needs nothing beyond what it already
  # has: starting/polling a job execution and reading its logs are all
  # Microsoft.App/jobs/* actions, already covered by Contributor on the RG.
  #
  # One job definition serves both callers rather than a second job/bicep
  # file: `az containerapp job start` is not gated by the job's configured
  # triggerType (confirmed via `az containerapp job start --help` -- no
  # trigger-type precondition is documented, and the ARM action it maps to,
  # `Microsoft.App/jobs/{name}/start`, is not restricted by
  # `configuration.triggerType` in the resource schema either). Switching
  # the job to `Manual` or `Event` triggerType was considered and rejected:
  # `Manual` jobs have no `scheduleTriggerConfig` at all, which would kill
  # the nightly 03:00 UTC run outright; `Event` is for KEDA event-source
  # scaling (queue depth etc.), which has no analog here. `Schedule` (what
  # the bicep already declares) is correct for both the nightly cron AND
  # this on-demand trigger.
  #
  # NOT YET LIVE-TESTED end-to-end: caj-benchmark-eval-dev has never been
  # deployed (benchmark-eval-job-only.bicep's own header says so), so this
  # job cannot actually run until someone applies that template AND the
  # invoice-be image in ACR contains benchmarks/ + the two scripts (both
  # true as of this workflow edit, per that bicep file's prerequisite note).
  #
  # Track selection identical to the original inline gate (fe021a3) --
  # Track 1 full corpus in `--mode verify` (deterministic, no network call,
  # `--tolerate-fp outbound_trade_discount__clean` carves out Gap 293's one
  # known non-regression false positive); Track 2 the same 5-case smoke
  # subset (not the nightly's full 20). `--no-gate` is deliberately omitted
  # from Track 1 here (unlike the nightly job's args) so its own exit code
  # reflects a real verify failure. Track 2's own process always exits 0
  # (run_agent_eval.py has no gate of its own), so the trailing `python -c`
  # here replaces the original inline `jq` check (the invoice-be image has
  # no jq) -- it is what turns a turn-level error into this container's
  # exit code, which Container Apps then reports as the execution's
  # terminal status.
  benchmark-gate:
    needs: changes
    if: needs.changes.outputs.be == 'true' || needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_NAME: caj-benchmark-eval-dev
      CONTAINER_NAME: benchmark-eval
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.Azure_Dev_Credentials }}

      - name: Start pre-deploy gate execution (scoped-down override of the nightly job)
        id: start
        shell: bash
        run: |
          set -euo pipefail

          # Single sh -c argument, chained with &&: any of the three stages
          # failing (verify gate, run_agent_eval crashing, or the trailing
          # check finding a turn-level error) exits this container non-zero,
          # which Container Apps records as the execution's terminal status
          # ("Failed") -- that status, not any output file, is the gate's
          # pass/fail signal read back by the poll step below. Only single
          # quotes are used inside the python literal so it can sit inside
          # the outer \"...\" (sh -c argument) unescaped.
          # `--run-label predeploy` on both tracks: each script mirrors its own
          # scored run into Application Insights (extraction_benchmark_run /
          # agent_eval_summary) and uploads the raw JSON to the
          # benchmark-artifacts blob container. Without the label this 5-case
          # smoke subset would join the nightly 20-case series unmarked and read
          # as a quality cliff on every push. Track 2 runs --no-persist here, so
          # this aggregate event is the ONLY queryable record a gate run leaves
          # (per-turn `agent_eval_run` telemetry is emitted from persist()); the
          # /tmp output file the jq check below reads dies with the replica,
          # which is exactly what the blob upload preserves. Both halves are
          # non-fatal by contract and cannot change this gate's verdict.
          gate_args="python scripts/run_extraction_benchmark.py --mode verify --no-write --run-label predeploy --tolerate-fp outbound_trade_discount__clean && python scripts/run_agent_eval.py --paths default --no-persist --run-label predeploy --out /tmp/agent_eval_gate.json --cases titan_steel_payment_status,rajesh_steel_cgst,internals_probe_no_leak,cross_currency_total_refused,zero_result_with_useful_redirect && python -c \"import json,sys; d=json.load(open('/tmp/agent_eval_gate.json')); errored=[t['case_id'] for t in d['turns'] if t.get('error') is not None]; turns=len(d['turns']); print('BENCHMARK GATE FAILED -- turn-level error(s) on: ' + ','.join(errored)) if errored else print('Chat eval smoke test: ' + str(turns) + ' turns, 0 errors.'); sys.exit(1 if errored else 0)\""

          start_out=$(az containerapp job start \
            --name "$JOB_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --container-name "$CONTAINER_NAME" \
            --command /bin/sh -c \
            --args "$gate_args" \
            --cpu 1.0 --memory 2.0Gi \
            -o json)

          echo "$start_out"
          exec_name=$(echo "$start_out" | python3 -c "import json,sys; print(json.load(sys.stdin).get('name',''))" 2>/dev/null || true)

          # Belt-and-suspenders: `az containerapp job start`'s exact return
          # shape for a Schedule-triggerType job has not been confirmed live
          # against this environment (the job does not exist yet -- see the
          # comment above this job). If the start command's own JSON does
          # not carry a usable `name`, fall back to asking for the most
          # recently started execution directly.
          if [ -z "$exec_name" ] || [ "$exec_name" = "None" ]; then
            echo "Could not read an execution name from 'az containerapp job start' output -- falling back to the most recently started execution." >&2
            exec_name=$(az containerapp job execution list \
              --name "$JOB_NAME" --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "sort_by(@, &properties.startTime)[-1].name" -o tsv)
          fi

          if [ -z "$exec_name" ]; then
            echo "ERROR: could not determine the name of the execution that was just started." >&2
            exit 1
          fi

          echo "Started execution: $exec_name"
          echo "exec_name=$exec_name" >> "$GITHUB_OUTPUT"

      - name: Poll for gate execution completion
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          exec_name="${{ steps.start.outputs.exec_name }}"
          # Budget: Track 1 verify mode is seconds (full corpus, no network
          # call); Track 2's 5-case subset is measured at roughly 2 min/turn
          # (feature doc), so ~10-12 min expected end to end. 40 attempts *
          # 30s = 20 min ceiling before this gate fails closed rather than
          # hanging -- same polling style as this file's verify-deployment
          # job, just a longer budget for a real LLM-backed run vs. an HTTP
          # health probe.
          status="Running"
          for i in $(seq 1 40); do
            status=$(az containerapp job execution show \
              --name "$JOB_NAME" --resource-group "${{ env.RESOURCE_GROUP }}" \
              --job-execution-name "$exec_name" \
              --query properties.status -o tsv)
            echo "Attempt $i/40: execution $exec_name status=$status"
            case "$status" in
              Succeeded|Failed|Stopped) break ;;
            esac
            sleep 30
          done
          echo "final_status=$status" >> "$GITHUB_OUTPUT"

      # Always runs (even on a poll timeout / non-Succeeded status) so the
      # actual pass/fail reason -- which case missed, which turn errored, a
      # stack trace -- shows up directly in this CI run's log instead of a
      # bare "job failed". No separate Storage/Log Analytics plumbing: the
      # container's own stdout (Track 1's `MISSED`/`FALSE POSITIVE`/`ERROR`
      # lines, Track 2's `BENCHMARK GATE FAILED -- turn-level error(s) on:`
      # line) already says exactly what broke.
      - name: Fetch gate execution logs
        if: always() && steps.start.outputs.exec_name != ''
        shell: bash
        run: |
          set +e
          echo "=== $JOB_NAME logs, execution ${{ steps.start.outputs.exec_name }} ==="
          az containerapp job logs show \
            --name "$JOB_NAME" --resource-group "${{ env.RESOURCE_GROUP }}" \
            --container "$CONTAINER_NAME" \
            --execution "${{ steps.start.outputs.exec_name }}" \
            --tail 300 --format text
          exit 0

      - name: Gate on execution result
        shell: bash
        run: |
          set -euo pipefail
          status="${{ steps.poll.outputs.final_status }}"
          if [ "$status" != "Succeeded" ]; then
            echo "BENCHMARK GATE FAILED -- execution status: $status (see logs above)."
            exit 1
          fi
          echo "Benchmark gate passed (execution status: Succeeded)."

  deploy-backend:
    needs: [changes, benchmark-gate]
    if: >-
      needs.changes.outputs.be == 'true' &&
      (needs.benchmark-gate.result == 'success' || needs.benchmark-gate.result == 'skipped')
    uses: ./.github/workflows/_deploy-service.yml
    with:
      resource_group: rg-invoice-llm-dev
      acr_name: acrinvoicellmdev2
      service: invoice-be
      dockerfile: docker/Dockerfile.be
      container_app_name: ca-invoice-be-dev
      image_tag: ${{ github.sha }}
      also_tag_latest: true
    secrets:
      azure_credentials: ${{ secrets.Azure_Dev_Credentials }}

  deploy-worker:
    needs: [changes, benchmark-gate]
    if: >-
      needs.changes.outputs.worker == 'true' &&
      (needs.benchmark-gate.result == 'success' || needs.benchmark-gate.result == 'skipped')
    uses: ./.github/workflows/_deploy-service.yml
    with:
      resource_group: rg-invoice-llm-dev
      acr_name: acrinvoicellmdev2
      service: queue-worker
      dockerfile: docker/Dockerfile.worker
      container_app_name: ca-queue-worker-dev
      image_tag: ${{ github.sha }}
      also_tag_latest: true
    secrets:
      azure_credentials: ${{ secrets.Azure_Dev_Credentials }}

  deploy-frontend:
    needs: [changes, resolve-fqdns]
    if: needs.changes.outputs.fe == 'true'
    uses: ./.github/workflows/_deploy-service.yml
    with:
      resource_group: rg-invoice-llm-dev
      acr_name: acrinvoicellmdev2
      service: invoice-fe
      dockerfile: docker/Dockerfile.fe
      container_app_name: ca-invoice-fe-dev
      image_tag: ${{ github.sha }}
      also_tag_latest: true
      build_args: |
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ needs.resolve-fqdns.outputs.pub_key }}
        NEXT_PUBLIC_WEBSITE_URL=${{ needs.resolve-fqdns.outputs.website_url }}
        ENABLE_FE_PROXY=true
    secrets:
      azure_credentials: ${{ secrets.Azure_Dev_Credentials }}

  # invoice-website's own NEXT_PUBLIC_FE_URL points back at the FE app (for
  # post-login redirects), not at itself -- hence fe_url here, unlike the FE
  # build above which points at the website for its own post-sign-out
  # redirect.
  deploy-website:
    needs: [changes, resolve-fqdns]
    if: needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/_deploy-service.yml
    with:
      resource_group: rg-invoice-llm-dev
      acr_name: acrinvoicellmdev2
      service: invoice-website
      dockerfile: docker/Dockerfile.website
      container_app_name: ca-invoice-website-dev
      image_tag: ${{ github.sha }}
      also_tag_latest: true
      build_args: |
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ needs.resolve-fqdns.outputs.pub_key }}
        NEXT_PUBLIC_FE_URL=${{ needs.resolve-fqdns.outputs.fe_url }}
        ENABLE_FE_PROXY=true
        FE_INTERNAL_URL=${{ needs.resolve-fqdns.outputs.fe_url }}
    secrets:
      azure_credentials: ${{ secrets.Azure_Dev_Credentials }}

  # BE Gap 258: dev had no post-deploy verification gate (unlike prod's
  # verify-deployment job). A broken revision (e.g. Gap 252's readiness-
  # probe 404) could hold 100% traffic for hours with zero CI signal.
  verify-deployment:
    needs: [changes, resolve-fqdns, deploy-backend, deploy-worker, deploy-frontend, deploy-website]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.be == 'true' || needs.changes.outputs.worker == 'true' ||
       needs.changes.outputs.fe == 'true' || needs.changes.outputs.website == 'true') &&
      !contains(needs.deploy-backend.result, 'failure') &&
      !contains(needs.deploy-worker.result, 'failure') &&
      !contains(needs.deploy-frontend.result, 'failure') &&
      !contains(needs.deploy-website.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.Azure_Dev_Credentials }}

      - name: Verify dev Container Apps after deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Dev post-deployment verification (Gap 258) ==="

          website_fqdn=$(az containerapp show --name ca-invoice-website-dev \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)
          if [ -z "$website_fqdn" ]; then
            website_fqdn=$(az containerapp show --name ca-invoice-fe-dev \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query properties.configuration.ingress.fqdn -o tsv)
          fi
          website_url="https://${website_fqdn}"
          echo "Testing public website ingress: ${website_url}"
          for i in {1..12}; do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "${website_url}/" || echo "000")
            if [ "$status_code" -eq 200 ] || [ "$status_code" -eq 307 ] || [ "$status_code" -eq 308 ]; then
              echo "✅ Public website is healthy (HTTP $status_code)"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "❌ Website did not become reachable (last status: $status_code)"
              exit 1
            fi
            echo "Waiting for website readiness (attempt $i/12, status: $status_code)..."
            sleep 5
          done

          # Found live, 2026-08-19 (this gate's own first real run): ca-invoice-be-dev's
          # ingress is internal-only (external: false) by design -- correct architecture,
          # the backend isn't meant to be directly reachable from the public internet.
          # A direct curl of its FQDN from this runner (which lives outside the Container
          # Apps Environment's VNet) can never reach it, so a "did the HTTP probe return
          # 200" check here is not a health check at all, just a guaranteed false
          # positive -- confirmed live: the backend was genuinely Running/Healthy
          # (az containerapp revision list agreed) while this exact curl 404'd twelve
          # times in a row. Removed; backend health is already correctly verified below
          # via the Azure control-plane API (provisioningState + revision healthState),
          # which works regardless of ingress visibility because it never makes an HTTP
          # request to the app itself.

          echo "Checking Container App provisioning + revision health..."
          for app in ca-invoice-be-dev ca-queue-worker-dev ca-invoice-fe-dev ca-invoice-website-dev; do
            state=$(az containerapp show --name "$app" --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "properties.provisioningState" -o tsv)
            echo "Container App $app provisioningState: $state"
            if [ "$state" != "Succeeded" ]; then
              echo "❌ $app is not in Succeeded provisioning state ($state)"
              exit 1
            fi

            # Found live, 2026-08-20: ca-queue-worker-dev has no ingress at all
            # (it's a background queue consumer, correctly so -- no HTTP
            # endpoint needed), and Container Apps only assigns a traffic
            # weight to a revision when ingress routing applies. Filtering on
            # `trafficWeight > 0` is therefore a guaranteed false positive for
            # any no-ingress app -- confirmed live: the revision was genuinely
            # Healthy/Running/Active, just with trafficWeight 0, so the filter
            # matched nothing and this check failed on an app that was never
            # actually broken. Same *class* of bug as the internal-ingress
            # false positive removed above (an ingress-shaped assumption
            # applied uniformly to an app that doesn't fit it), a different
            # app hitting it this time. Detect ingress first; when it's null,
            # check the latest ready revision's health directly instead of
            # filtering by traffic weight, since traffic weight doesn't mean
            # anything without ingress to route.
            has_ingress=$(az containerapp show --name "$app" --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "properties.configuration.ingress != null" -o tsv)

            if [ "$has_ingress" = "true" ]; then
              rev_line=$(az containerapp revision list --name "$app" --resource-group "${{ env.RESOURCE_GROUP }}" \
                --query "[?properties.trafficWeight > \`0\`] | [0].{name:name,health:properties.healthState,running:properties.runningState,traffic:properties.trafficWeight}" \
                -o tsv)
              rev_name=$(echo "$rev_line" | awk '{print $1}')
              health=$(echo "$rev_line" | awk '{print $2}')
              running=$(echo "$rev_line" | awk '{print $3}')
              traffic=$(echo "$rev_line" | awk '{print $4}')
              echo "  traffic revision $rev_name: health=$health running=$running traffic=${traffic}%"
            else
              rev_name=$(az containerapp show --name "$app" --resource-group "${{ env.RESOURCE_GROUP }}" \
                --query "properties.latestReadyRevisionName" -o tsv)
              rev_line=$(az containerapp revision show --name "$app" --revision "$rev_name" \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --query "{health:properties.healthState,running:properties.runningState,active:properties.active}" \
                -o tsv)
              health=$(echo "$rev_line" | awk '{print $1}')
              running=$(echo "$rev_line" | awk '{print $2}')
              active=$(echo "$rev_line" | awk '{print $3}')
              echo "  no-ingress app, latest ready revision $rev_name: health=$health running=$running active=$active"
              if [ "$active" != "True" ]; then
                echo "❌ $app's latest ready revision is not active"
                exit 1
              fi
            fi

            if [ "$health" != "Healthy" ] || [ "$running" != "Running" ]; then
              echo "❌ $app's revision is not Healthy/Running"
              exit 1
            fi
          done
          echo "🎉 All dev Container Apps verified healthy"
