name: Deploy to Dev Environment (Azure)

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: invoice-llm-dev
      ACR_NAME: acrinvoicellmdev

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Free up disk space (removes .NET, Android SDK, Haskell — frees ~20-30 GB)
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      # 3. Set up Docker Buildx (enables layer caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Authenticate with Azure (Service Principal)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 5. Log in to Azure Container Registry (ACR)
      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      # 6. Build and Push Backend API Image
      - name: Build & Push Backend API
        uses: docker/build-push-action@v5
        with:
          context: ./Prod_Invoice_LLM
          file: ./Prod_Invoice_LLM/docker/Dockerfile.be
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/invoice-be:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/invoice-be:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Build and Push Celery Worker Image
      - name: Build & Push Celery Worker
        uses: docker/build-push-action@v5
        with:
          context: ./Prod_Invoice_LLM
          file: ./Prod_Invoice_LLM/docker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/celery-worker:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/celery-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Build and Push Frontend UI Image
      - name: Build & Push Frontend UI
        uses: docker/build-push-action@v5
        with:
          context: ./Prod_Invoice_LLM
          file: ./Prod_Invoice_LLM/docker/Dockerfile.fe
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/invoice-fe:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/invoice-fe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Container Apps images (no Bicep)
        shell: bash
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          ACR_NAME: ${{ env.ACR_NAME }}
          GITHUB_SHA: ${{ github.sha }}
          PARAMS_FILE: Prod_Invoice_LLM/infra/params.dev.json
        run: |
          set -euo pipefail

          # ensure jq is available
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          echo "Using params file: $PARAMS_FILE"
          jq -c '.' $PARAMS_FILE || true

          namingPrefix=$(jq -r '.parameters.namingPrefix.value // empty' $PARAMS_FILE)
          environment=$(jq -r '.parameters.environment.value // empty' $PARAMS_FILE)

          if [ -z "$namingPrefix" ] || [ -z "$environment" ]; then
            echo "ERROR: namingPrefix or environment not found in $PARAMS_FILE" >&2
            exit 1
          fi

          # Optional explicit app names in params.dev.json:
          backend_app=$(jq -r '.parameters.backendAppName.value // empty' $PARAMS_FILE)
          worker_app=$(jq -r '.parameters.celeryWorkerAppName.value // empty' $PARAMS_FILE)
          frontend_app=$(jq -r '.parameters.frontendAppName.value // empty' $PARAMS_FILE)

          # Derive names if not explicitly present
          if [ -z "$backend_app" ]; then
            backend_app="${namingPrefix}-backend-${environment}"
          fi
          if [ -z "$worker_app" ]; then
            worker_app="${namingPrefix}-worker-${environment}"
          fi
          if [ -z "$frontend_app" ]; then
            frontend_app="${namingPrefix}-frontend-${environment}"
          fi

          echo "Using app names:"
          echo "  backend:  $backend_app"
          echo "  worker:   $worker_app"
          echo "  frontend: $frontend_app"

          backend_img="${ACR_NAME}.azurecr.io/invoice-be:${GITHUB_SHA}"
          worker_img="${ACR_NAME}.azurecr.io/celery-worker:${GITHUB_SHA}"
          frontend_img="${ACR_NAME}.azurecr.io/invoice-fe:${GITHUB_SHA}"

          echo "Updating backend ($backend_app) -> $backend_img"
          if az containerapp show --name "$backend_app" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update --name "$backend_app" --resource-group "$RESOURCE_GROUP" --set properties.template.containers[0].image="$backend_img"
          else
            echo "Warning: backend app $backend_app not found in $RESOURCE_GROUP" >&2
          fi

          echo "Updating worker ($worker_app) -> $worker_img"
          if az containerapp show --name "$worker_app" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update --name "$worker_app" --resource-group "$RESOURCE_GROUP" --set properties.template.containers[0].image="$worker_img"
          else
            echo "Warning: worker app $worker_app not found in $RESOURCE_GROUP" >&2
          fi

          echo "Updating frontend ($frontend_app) -> $frontend_img"
          if az containerapp show --name "$frontend_app" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update --name "$frontend_app" --resource-group "$RESOURCE_GROUP" --set properties.template.containers[0].image="$frontend_img"
          else
            echo "Warning: frontend app $frontend_app not found in $RESOURCE_GROUP" >&2
          fi

          echo "Verifying current image tags (backend, worker, frontend):"
          az containerapp show --name "$backend_app" --resource-group "$RESOURCE_GROUP" --query "properties.template.containers[0].image" -o tsv || true
          az containerapp show --name "$worker_app" --resource-group "$RESOURCE_GROUP" --query "properties.template.containers[0].image" -o tsv || true
          az containerapp show --name "$frontend_app" --resource-group "$RESOURCE_GROUP" --query "properties.template.containers[0].image" -o tsv || true

