name: Deploy to Dev Environment (Azure)

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-invoice-llm-dev
  ACR_NAME: acrinvoicellmdev2

jobs:
  # Path-filtered so each service only rebuilds/redeploys when its own
  # files changed, instead of the old single job that rebuilt all 4
  # containers on every push regardless of what changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.decide.outputs.be }}
      worker: ${{ steps.decide.outputs.worker }}
      fe: ${{ steps.decide.outputs.fe }}
      website: ${{ steps.decide.outputs.website }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            be:
              - 'Prod_Invoice_LLM/apps/invoice-be/**'
              - 'Prod_Invoice_LLM/docker/Dockerfile.be'
            worker:
              - 'Prod_Invoice_LLM/apps/invoice-be/**'
              - 'Prod_Invoice_LLM/docker/Dockerfile.worker'
            fe:
              - 'Prod_Invoice_LLM/apps/invoice-fe/**'
              - 'Prod_Invoice_LLM/docker/Dockerfile.fe'
            website:
              - 'Prod_Invoice_LLM/apps/invoice-website/**'
              - 'Prod_Invoice_LLM/docker/Dockerfile.website'

      # dorny/paths-filter has no meaningful "before" commit to diff against
      # on workflow_dispatch (no push event => no base sha), so a manual run
      # deploys everything rather than silently deploying nothing.
      - name: Decide what to deploy
        id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "be=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "fe=true" >> "$GITHUB_OUTPUT"
            echo "website=true" >> "$GITHUB_OUTPUT"
          else
            echo "be=${{ steps.filter.outputs.be }}" >> "$GITHUB_OUTPUT"
            echo "worker=${{ steps.filter.outputs.worker }}" >> "$GITHUB_OUTPUT"
            echo "fe=${{ steps.filter.outputs.fe }}" >> "$GITHUB_OUTPUT"
            echo "website=${{ steps.filter.outputs.website }}" >> "$GITHUB_OUTPUT"
          fi

  # Resolves Azure FQDNs + the (public) Clerk publishable key needed as
  # Docker build-args for the FE/website images (NEXT_PUBLIC_* vars are
  # inlined into the client bundle by `next build`, so they must be known
  # BEFORE those images build -- a runtime Container App env var arrives
  # too late). Only runs when fe and/or website actually changed.
  resolve-fqdns:
    needs: changes
    if: needs.changes.outputs.fe == 'true' || needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    outputs:
      pub_key: ${{ steps.resolve.outputs.pub_key }}
      fe_url: ${{ steps.resolve.outputs.fe_url }}
      website_url: ${{ steps.resolve.outputs.website_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.Azure_Dev_Credentials }}

      - name: Resolve Azure FQDNs and Clerk key
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          params="Prod_Invoice_LLM/infra/params.dev.json"

          fe_fqdn=$(az containerapp show --name ca-invoice-fe-dev \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)

          # Clerk publishable keys are public by design (they already ship inside
          # the browser bundle), so this is read from the committed params file
          # rather than a GitHub secret.
          pub_key=$(python3 -c "import json;print(json.load(open('$params'))['parameters']['nextPublicClerkPublishableKey']['value'])")

          if [ -z "$pub_key" ] || [[ "$pub_key" == *mock* ]] || [[ "$pub_key" == *REPLACE_WITH* ]]; then
            echo "ERROR: nextPublicClerkPublishableKey in $params is empty or still a placeholder." >&2
            exit 1
          fi

          website_fqdn=$(az containerapp show --name ca-invoice-website-dev \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)

          if [ -z "$website_fqdn" ]; then
            echo "WARNING: ca-invoice-website-dev not found yet -- falling back to FE origin for website_url." >&2
            website_fqdn="${fe_fqdn}"
          fi

          echo "website_url=https://${website_fqdn}" >> "$GITHUB_OUTPUT"
          echo "fe_url=https://${fe_fqdn}" >> "$GITHUB_OUTPUT"
          echo "pub_key=${pub_key}" >> "$GITHUB_OUTPUT"

          echo "Resolved FE FQDN: ${fe_fqdn}"
          echo "Resolved website FQDN: ${website_fqdn}"

  # Note: CLERK_SECRET_KEY is NOT synced to Key Vault by this workflow.
  # infra/05-secrets.bicep (Stage 5 of deploy-all.ps1) already seeds it from
  # the local, gitignored infra/params.dev.secrets.json the one time someone
  # runs the full manual deploy -- Key Vault secrets persist independently
  # after that, and this workflow never runs bicep, so there's nothing for
  # CI to re-sync on every push. If the key ever needs to rotate, update
  # params.dev.secrets.json locally and re-run Stage 5.

  deploy-backend:
    needs: changes
    if: needs.changes.outputs.be == 'true'
    uses: ./.github/workflows/_deploy-service.yml
    with:
      resource_group: rg-invoice-llm-dev
      acr_name: acrinvoicellmdev2
      service: invoice-be
      dockerfile: docker/Dockerfile.be
      container_app_name: ca-invoice-be-dev
      image_tag: ${{ github.sha }}
      also_tag_latest: true
    secrets:
      azure_credentials: ${{ secrets.Azure_Dev_Credentials }}

  deploy-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    uses: ./.github/workflows/_deploy-service.yml
    with:
      resource_group: rg-invoice-llm-dev
      acr_name: acrinvoicellmdev2
      service: queue-worker
      dockerfile: docker/Dockerfile.worker
      container_app_name: ca-queue-worker-dev
      image_tag: ${{ github.sha }}
      also_tag_latest: true
    secrets:
      azure_credentials: ${{ secrets.Azure_Dev_Credentials }}

  deploy-frontend:
    needs: [changes, resolve-fqdns]
    if: needs.changes.outputs.fe == 'true'
    uses: ./.github/workflows/_deploy-service.yml
    with:
      resource_group: rg-invoice-llm-dev
      acr_name: acrinvoicellmdev2
      service: invoice-fe
      dockerfile: docker/Dockerfile.fe
      container_app_name: ca-invoice-fe-dev
      image_tag: ${{ github.sha }}
      also_tag_latest: true
      build_args: |
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ needs.resolve-fqdns.outputs.pub_key }}
        NEXT_PUBLIC_WEBSITE_URL=${{ needs.resolve-fqdns.outputs.website_url }}
        ENABLE_FE_PROXY=true
    secrets:
      azure_credentials: ${{ secrets.Azure_Dev_Credentials }}

  # invoice-website's own NEXT_PUBLIC_FE_URL points back at the FE app (for
  # post-login redirects), not at itself -- hence fe_url here, unlike the FE
  # build above which points at the website for its own post-sign-out
  # redirect.
  deploy-website:
    needs: [changes, resolve-fqdns]
    if: needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/_deploy-service.yml
    with:
      resource_group: rg-invoice-llm-dev
      acr_name: acrinvoicellmdev2
      service: invoice-website
      dockerfile: docker/Dockerfile.website
      container_app_name: ca-invoice-website-dev
      image_tag: ${{ github.sha }}
      also_tag_latest: true
      build_args: |
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ needs.resolve-fqdns.outputs.pub_key }}
        NEXT_PUBLIC_FE_URL=${{ needs.resolve-fqdns.outputs.fe_url }}
        ENABLE_FE_PROXY=true
        FE_INTERNAL_URL=${{ needs.resolve-fqdns.outputs.fe_url }}
    secrets:
      azure_credentials: ${{ secrets.Azure_Dev_Credentials }}

  # BE Gap 258: dev had no post-deploy verification gate (unlike prod's
  # verify-deployment job). A broken revision (e.g. Gap 252's readiness-
  # probe 404) could hold 100% traffic for hours with zero CI signal.
  verify-deployment:
    needs: [changes, resolve-fqdns, deploy-backend, deploy-worker, deploy-frontend, deploy-website]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.be == 'true' || needs.changes.outputs.worker == 'true' ||
       needs.changes.outputs.fe == 'true' || needs.changes.outputs.website == 'true') &&
      !contains(needs.deploy-backend.result, 'failure') &&
      !contains(needs.deploy-worker.result, 'failure') &&
      !contains(needs.deploy-frontend.result, 'failure') &&
      !contains(needs.deploy-website.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.Azure_Dev_Credentials }}

      - name: Verify dev Container Apps after deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Dev post-deployment verification (Gap 258) ==="

          website_fqdn=$(az containerapp show --name ca-invoice-website-dev \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)
          if [ -z "$website_fqdn" ]; then
            website_fqdn=$(az containerapp show --name ca-invoice-fe-dev \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query properties.configuration.ingress.fqdn -o tsv)
          fi
          website_url="https://${website_fqdn}"
          echo "Testing public website ingress: ${website_url}"
          for i in {1..12}; do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "${website_url}/" || echo "000")
            if [ "$status_code" -eq 200 ] || [ "$status_code" -eq 307 ] || [ "$status_code" -eq 308 ]; then
              echo "✅ Public website is healthy (HTTP $status_code)"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "❌ Website did not become reachable (last status: $status_code)"
              exit 1
            fi
            echo "Waiting for website readiness (attempt $i/12, status: $status_code)..."
            sleep 5
          done

          be_fqdn=$(az containerapp show --name ca-invoice-be-dev \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          be_url="https://${be_fqdn}"
          echo "Testing backend readiness probe path: ${be_url}/health/readiness"
          for i in {1..12}; do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "${be_url}/health/readiness" || echo "000")
            if [ "$status_code" -eq 200 ]; then
              echo "✅ Backend /health/readiness is healthy (HTTP $status_code)"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "❌ Backend /health/readiness did not return 200 (last status: $status_code)"
              exit 1
            fi
            echo "Waiting for backend readiness (attempt $i/12, status: $status_code)..."
            sleep 5
          done

          echo "Checking Container App provisioning + revision health..."
          for app in ca-invoice-be-dev ca-queue-worker-dev ca-invoice-fe-dev ca-invoice-website-dev; do
            state=$(az containerapp show --name "$app" --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "properties.provisioningState" -o tsv)
            echo "Container App $app provisioningState: $state"
            if [ "$state" != "Succeeded" ]; then
              echo "❌ $app is not in Succeeded provisioning state ($state)"
              exit 1
            fi

            traffic_rev=$(az containerapp revision list --name "$app" --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "[?properties.trafficWeight > \`0\`] | [0].{name:name,health:properties.healthState,running:properties.runningState,traffic:properties.trafficWeight}" \
              -o tsv)
            rev_name=$(echo "$traffic_rev" | awk '{print $1}')
            health=$(echo "$traffic_rev" | awk '{print $2}')
            running=$(echo "$traffic_rev" | awk '{print $3}')
            traffic=$(echo "$traffic_rev" | awk '{print $4}')
            echo "  traffic revision $rev_name: health=$health running=$running traffic=${traffic}%"
            if [ "$health" != "Healthy" ] || [ "$running" != "Running" ]; then
              echo "❌ $app traffic-bearing revision is not Healthy/Running"
              exit 1
            fi
          done
          echo "🎉 All dev Container Apps verified healthy"
