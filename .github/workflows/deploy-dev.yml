name: Deploy to Dev Environment (Azure)

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: invoice-llm-dev
      ACR_NAME: acrinvoiceaidev

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Free up disk space (removes .NET, Android SDK, Haskell — frees ~20-30 GB)
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      # 3. Set up Docker Buildx (enables layer caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Authenticate with Azure (Service Principal)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 5. Log in to Azure Container Registry (ACR)
      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      # 6. Build and Push Backend API Image
      - name: Build & Push Backend API
        uses: docker/build-push-action@v5
        with:
          context: ./Prod_Invoice_LLM
          file: ./Prod_Invoice_LLM/docker/Dockerfile.be
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/invoice-be:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/invoice-be:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Build and Push Celery Worker Image
      - name: Build & Push Celery Worker
        uses: docker/build-push-action@v5
        with:
          context: ./Prod_Invoice_LLM
          file: ./Prod_Invoice_LLM/docker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/celery-worker:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/celery-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Build and Push Frontend UI Image
      - name: Build & Push Frontend UI
        uses: docker/build-push-action@v5
        with:
          context: ./Prod_Invoice_LLM
          file: ./Prod_Invoice_LLM/docker/Dockerfile.fe
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/invoice-fe:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/invoice-fe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 9. Deploy Infrastructure (Bicep) with Updated Image Tags
      - name: Deploy to Azure Container Apps
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./Prod_Invoice_LLM/infra/main.bicep
          parameters: >
            ./Prod_Invoice_LLM/infra/params.dev.json
            backendImage=${{ env.ACR_NAME }}.azurecr.io/invoice-be:${{ github.sha }}
            celeryWorkerImage=${{ env.ACR_NAME }}.azurecr.io/celery-worker:${{ github.sha }}
            frontendImage=${{ env.ACR_NAME }}.azurecr.io/invoice-fe:${{ github.sha }}
