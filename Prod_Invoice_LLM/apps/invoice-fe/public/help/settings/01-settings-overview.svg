    <rect x="12" y="116" width="106" height="34" rx="6" fill="#0B0F19" stroke="#222D3D"/>
    <text x="18" y="132" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">LOP Data Sync</text>
    <text x="18" y="144" fill="#64748B" font-family="'Inter', sans-serif" font-size="8">Cross-service</text>
    <rect x="12" y="158" width="106" height="46" rx="6" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.3"/>
    <text x="18" y="176" fill="#34D399" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Key Rotation</text>
    <text x="18" y="192" fill="#64748B" font-family="'Inter', sans-serif" font-size="8">Instant revoke</text>
