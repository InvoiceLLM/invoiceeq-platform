    <text x="18" y="149" fill="#64748B" font-family="'Inter', sans-serif" font-size="9">whsec_ salted keys</text>
    <rect x="12" y="166" width="146" height="46" rx="6" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.3"/>
    <text x="18" y="184" fill="#C4B5FD" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Tenant Scoping</text>
    <text x="18" y="198" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9">Strict PostgreSQL row-level</text>
