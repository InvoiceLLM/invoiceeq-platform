    <rect x="10" y="14" width="30" height="30" rx="6" fill="#06B6D4" fill-opacity="0.15"/>
    <circle cx="25" cy="29" r="6" fill="#22D3EE"/>
    <text x="46" y="26" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Tiers</text>
    <text x="46" y="38" fill="#64748B" font-family="'Inter', sans-serif" font-size="9">Billing</text>
    <line x1="10" y1="56" x2="80" y2="56" stroke="#222D3D"/>
    <rect x="8" y="70" width="74" height="42" rx="6" fill="#0B0F19" stroke="#222D3D"/>
    <text x="12" y="86" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" font-weight="700">Free</text>
    <text x="12" y="100" fill="#64748B" font-family="'Inter', sans-serif" font-size="8">50 inv/mo</text>
    <rect x="8" y="122" width="74" height="42" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-opacity="0.3"/>
    <text x="12" y="138" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="9" font-weight="700">Pro</text>
    <text x="12" y="152" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">Unlimited AP</text>
    <rect x="8" y="174" width="74" height="34" rx="6" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.3"/>
    <text x="12" y="192" fill="#C4B5FD" font-family="'Inter', sans-serif" font-size="9" font-weight="700">Combined</text>
