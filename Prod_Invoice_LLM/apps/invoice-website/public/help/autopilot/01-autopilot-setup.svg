  <g transform="translate(248, 90)">
    <rect width="180" height="230" rx="12" fill="#151B26" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="12" y="14" width="36" height="36" rx="8" fill="#8B5CF6" fill-opacity="0.15"/>
    <!-- Shield Icon -->
    <path d="M30 24L38 27V33C38 37 34 40 30 42C26 40 22 37 22 33V27L30 24Z" fill="#A78BFA"/>
    <text x="56" y="28" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Dedup Guard</text>
    <text x="56" y="42" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">Zero Duplicate Spend</text>
    <line x1="12" y1="62" x2="168" y2="62" stroke="#222D3D"/>
    <rect x="12" y="74" width="156" height="42" rx="6" fill="#0B0F19" stroke="#222D3D"/>
    <text x="20" y="90" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Layer 1: Google File ID</text>
    <text x="20" y="105" fill="#64748B" font-family="'Inter', sans-serif" font-size="9">Matches source file identity</text>
    <rect x="12" y="126" width="156" height="42" rx="6" fill="#0B0F19" stroke="#222D3D"/>
    <text x="20" y="142" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Layer 2: SHA-256 Hash</text>
    <text x="20" y="157" fill="#64748B" font-family="'Inter', sans-serif" font-size="9">Compares payload bytes</text>
    <rect x="12" y="178" width="156" height="38" rx="6" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.3"/>
    <text x="20" y="194" fill="#C4B5FD" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Tenant Quota Charge</text>
    <text x="20" y="207" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9">Decrements only on unique</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M438 205 L468 205" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="468,201 476,205 468,209" fill="#8B5CF6"/>

  <!-- Step 3: LLM Extraction Pipeline -->
  <g transform="translate(486, 90)">
    <rect width="130" height="230" rx="12" fill="#151B26" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="12" y="14" width="36" height="36" rx="8" fill="#10B981" fill-opacity="0.15"/>
    <circle cx="30" cy="32" r="7" fill="#34D399"/>
    <text x="56" y="28" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">AI Pipeline</text>
    <text x="56" y="42" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">NOVA &amp; SENTINEL</text>
    <line x1="12" y1="62" x2="118" y2="62" stroke="#222D3D"/>
    <rect x="12" y="74" width="106" height="34" rx="6" fill="#0B0F19" stroke="#222D3D"/>
    <text x="18" y="94" fill="#34D399" font-family="'Inter', sans-serif" font-size="10" font-weight="600">1. OCR &amp; Bounding</text>
    <rect x="12" y="118" width="106" height="34" rx="6" fill="#0B0F19" stroke="#222D3D"/>
    <text x="18" y="138" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">2. LLM Extraction</text>
    <rect x="12" y="162" width="106" height="46" rx="6" fill="#0B0F19" stroke="#222D3D"/>
    <text x="18" y="180" fill="#FBBF24" font-family="'Inter', sans-serif" font-size="10" font-weight="600">3. Rule Audit</text>
    <text x="18" y="196" fill="#64748B" font-family="'Inter', sans-serif" font-size="9">Alert Check</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M626 205 L656 205" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="656,201 664,205 656,209" fill="#10B981"/>

  <!-- Step 4: Dispatch & Review -->
  <g transform="translate(674, 90)">
    <rect width="90" height="230" rx="12" fill="#151B26" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="10" y="14" width="30" height="30" rx="6" fill="#EC4899" fill-opacity="0.15"/>
    <circle cx="25" cy="29" r="6" fill="#F472B6"/>
    <text x="46" y="26" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Output</text>
    <text x="46" y="38" fill="#64748B" font-family="'Inter', sans-serif" font-size="9">Result</text>
    <line x1="10" y1="56" x2="80" y2="56" stroke="#222D3D"/>
    <rect x="8" y="70" width="74" height="42" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3"/>
    <text x="12" y="86" fill="#34D399" font-family="'Inter', sans-serif" font-size="9" font-weight="700">COMPLETED</text>
    <text x="12" y="100" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">Auto-Approved</text>
    <rect x="8" y="122" width="74" height="42" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.3"/>
    <text x="12" y="138" fill="#FBBF24" font-family="'Inter', sans-serif" font-size="9" font-weight="700">AUDIT REQ</text>
    <text x="12" y="152" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8">Review Queue</text>
    <rect x="8" y="174" width="74" height="34" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-opacity="0.3"/>
    <text x="14" y="192" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="9" font-weight="700">Email Report</text>
  </g>
</svg>
