<svg width="800" height="380" viewBox="0 0 800 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="380" rx="16" fill="#0B0F19"/>
  <rect x="0.5" y="0.5" width="799" height="379" rx="15.5" stroke="#222D3D"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="760" height="40" rx="8" fill="#151B26" stroke="#222D3D"/>
  <circle cx="42" cy="40" r="5" fill="#EF4444"/>
  <circle cx="58" cy="40" r="5" fill="#F59E0B"/>
  <circle cx="74" cy="40" r="5" fill="#10B981"/>
  <text x="100" y="44" fill="#94A3B8" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600">Autopilot Sync Architecture &amp; Deduplication Guard</text>
  <rect x="670" y="28" width="94" height="24" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="682" y="44" fill="#34D399" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700">ACTIVE CRON</text>

  <!-- Step 1: Google Drive Source -->
  <g transform="translate(40, 90)">
    <rect width="150" height="230" rx="12" fill="#151B26" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="12" y="14" width="36" height="36" rx="8" fill="#3B82F6" fill-opacity="0.15"/>
    <!-- Folder Icon -->
    <path d="M22 26H28L30 29H38V38H22V26Z" fill="#3B82F6"/>
    <text x="56" y="28" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Google Drive</text>
    <text x="56" y="42" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">Cloud Connector</text>
    <line x1="12" y1="62" x2="138" y2="62" stroke="#222D3D"/>
    <text x="14" y="82" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Watched Folder:</text>
    <rect x="12" y="92" width="126" height="26" rx="6" fill="#0B0F19" stroke="#222D3D"/>
    <text x="20" y="109" fill="#38BDF8" font-family="'Courier New', monospace" font-size="10">/Invoices/2026/Q3</text>
    <text x="14" y="138" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Interval:</text>
    <rect x="12" y="148" width="126" height="26" rx="6" fill="#0B0F19" stroke="#222D3D"/>
    <text x="20" y="165" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10">Every 15 minutes</text>
    <rect x="12" y="186" width="126" height="30" rx="6" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-opacity="0.2"/>
    <text x="26" y="205" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Sync Now ↻</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M200 205 L230 205" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="230,201 238,205 230,209" fill="#3B82F6"/>

