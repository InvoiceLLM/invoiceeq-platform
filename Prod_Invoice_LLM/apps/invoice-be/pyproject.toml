[project]
name = "invoice-be"
version = "0.1.0"
description = "FastAPI Backend for Invoice AI SaaS Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlmodel>=0.0.16",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "langchain>=0.1.11",
    "langchain-openai>=0.0.8",
    "langgraph>=0.0.26",
    "pydantic>=2.6.4",
    "cryptography>=42.0.5",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.1",
    "langchain-community>=0.0.28",
    "pypdf>=4.0.0",
    "azure-ai-documentintelligence>=1.0.2",
    "azure-core>=1.41.0",
    "pyjwt>=2.8.0",
    "azure-storage-blob>=12.19.0",
    "pymupdf>=1.28.0",
    "langchain-ollama>=1.1.0",
    "pillow>=12.2.0",
    "tiktoken>=0.13.0",
    "sentence-transformers>=5.6.0",
    "chromadb>=1.5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
