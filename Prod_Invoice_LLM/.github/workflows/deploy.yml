name: Deploy Invoice-LLM Apps to Azure

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name acrinvoicellmdev2

      - name: Build and Push Backend Container Image
        run: |
          docker build -t acrinvoicellmdev2.azurecr.io/invoice-be:latest -f docker/Dockerfile.be .
          docker push acrinvoicellmdev2.azurecr.io/invoice-be:latest

      - name: Build and Push Queue Worker Container Image
        run: |
          docker build -t acrinvoicellmdev2.azurecr.io/queue-worker:latest -f docker/Dockerfile.worker .
          docker push acrinvoicellmdev2.azurecr.io/queue-worker:latest

      - name: Build and Push Frontend App Container Image
        run: |
          docker build -t acrinvoicellmdev2.azurecr.io/invoice-fe:latest \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="pk_test_cmVhbC1zdGFsbGlvbi0yMS5jbGVyay5hY2NvdW50cy5kZXYk" \
            -f docker/Dockerfile.fe .
          docker push acrinvoicellmdev2.azurecr.io/invoice-fe:latest

      - name: Build and Push Marketing Website Container Image
        run: |
          docker build -t acrinvoicellmdev2.azurecr.io/invoice-website:latest \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="pk_test_cmVhbC1zdGFsbGlvbi0yMS5jbGVyay5hY2NvdW50cy5kZXYk" \
            --build-arg ENABLE_FE_PROXY="true" \
            --build-arg FE_INTERNAL_URL="https://ca-invoice-fe-dev.internal.thankfulmeadow-4281ea23.eastus2.azurecontainerapps.io" \
            -f docker/Dockerfile.website .
          docker push acrinvoicellmdev2.azurecr.io/invoice-website:latest

      - name: Update Azure Container Apps
        run: |
          az containerapp update --name ca-invoice-be-dev --resource-group rg-invoice-llm-dev --image acrinvoicellmdev2.azurecr.io/invoice-be:latest
          az containerapp update --name ca-queue-worker-dev --resource-group rg-invoice-llm-dev --image acrinvoicellmdev2.azurecr.io/queue-worker:latest
          az containerapp update --name ca-invoice-fe-dev --resource-group rg-invoice-llm-dev --image acrinvoicellmdev2.azurecr.io/invoice-fe:latest
          az containerapp update --name ca-invoice-website-dev --resource-group rg-invoice-llm-dev --image acrinvoicellmdev2.azurecr.io/invoice-website:latest
